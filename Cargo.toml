[workspace]
resolver = "3"
members = ["crates/nailong-core", "crates/nailong-cli", "crates/nailong-ui"]

[workspace.package]
edition = "2024"
version = "0.30.0"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "json", "gzip", "system-proxy", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
rayon = "1"
directories = "6"
uuid = { version = "1", features = ["v3", "v4", "v5", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.18"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "system_fonts", "x11"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
