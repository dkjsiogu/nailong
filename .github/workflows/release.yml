name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.0)"
        required: true
        default: "v0.30.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux deb
    runs-on: ubuntu-24.04
    env:
      # Optional project key; empty until the CurseForge application is approved.
      NAILONG_CURSEFORGE_API_KEY: ${{ secrets.NAILONG_CURSEFORGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            binutils dpkg-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ hashFiles('**/Cargo.lock') }}

      - name: Build .deb
        run: ./scripts/build-deb.sh

      - name: Show package
        run: |
          ls -lh dist/cairn_*.deb
          dpkg-deb --info dist/cairn_*.deb | sed -n '1,18p'

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-linux-deb
          path: dist/cairn_*.deb
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows exe
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      # Keep the exe self-contained: no VCRUNTIME140.dll / UCRT dependency.
      RUSTFLAGS: -C target-feature=+crt-static
      # Optional project key; empty until the CurseForge application is approved.
      NAILONG_CURSEFORGE_API_KEY: ${{ secrets.NAILONG_CURSEFORGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-static-${{ hashFiles('**/Cargo.lock') }}

      - name: Build GUI
        run: cargo build --release -p nailong-ui --bin cairn

      - name: Stage single exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/cairn.exe dist/cairn.exe
          $info = (Get-Item dist/cairn.exe).VersionInfo
          $info | Format-List ProductName,FileDescription,FileVersion,OriginalFilename
          # 图标和版本信息由 crates/nailong-ui/build.rs 写进 exe；没写进去就别发版。
          if ($info.ProductName -ne "Cairn") { throw "exe 里没有版本信息资源" }

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: cairn-windows-exe
          path: dist/cairn.exe
          if-no-files-found: error
          retention-days: 7

  # 代码签名（预留）：在仓库设置里配好 SignPath Foundation 的变量和令牌后才会运行，
  # 否则整个任务跳过，发布未签名的 exe。见 docs/design/22-windows-trust.md。
  #   Variables: SIGNPATH_ORGANIZATION_ID、SIGNPATH_PROJECT_SLUG、SIGNPATH_POLICY_SLUG
  #   Secrets:   SIGNPATH_API_TOKEN
  sign:
    name: Sign Windows exe
    needs: [windows]
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ needs.windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-windows-exe-signed
          path: signed/cairn.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [linux, windows, sign]
    # 签名任务被跳过（没配签名）时照样发布；签名失败则不发布。
    if: ${{ always() && needs.linux.result == 'success' && needs.windows.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # 发布说明用这次发版提交的说明：启动器的更新弹窗会显示它。
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Release notes from the commit message
        run: |
          git log -1 --format=%B | grep -v '^Co-Authored-By' > notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble assets
        run: |
          mkdir -p release
          cp artifacts/cairn-linux-deb/*.deb release/
          if [ -f artifacts/cairn-windows-exe-signed/cairn.exe ]; then
            echo "使用已签名的 exe"
            cp artifacts/cairn-windows-exe-signed/cairn.exe release/
          else
            cp artifacts/cairn-windows-exe/cairn.exe release/
          fi
          cd release
          sha256sum cairn.exe ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Cairn ${TAG#v}" \
              --notes-file notes.md
          fi
